  <main>
    <section class="page-head">
      <div class="container">
        <p class="eyebrow reveal"><span class="px-ico" data-px="diamond"></span>05 / Contact</p>
        <h1 class="page-head__title glow reveal" style="--d:.08s"><span data-scramble>Let&rsquo;s talk.</span></h1>
      </div>
    </section>

    <section class="section contact page-body">
      <div class="container">
        <div class="contact__grid">
          <form class="window term reveal" id="contactForm" novalidate>
            <div class="window__bar"><span>new_message.sh</span><span class="window__btns" aria-hidden="true"><i></i><i></i><i></i></span></div>
            <div class="term__body">
              <p class="term__hint">// fill in the blanks and hit send_</p>
              <label class="term__row"><span class="term__prompt">&gt; name:</span><input name="name" type="text" required autocomplete="name" placeholder="your name"></label>
              <label class="term__row"><span class="term__prompt">&gt; email:</span><input name="email" type="email" required autocomplete="email" placeholder="you@domain.com"></label>
              <label class="term__row term__row--area"><span class="term__prompt">&gt; message:</span><textarea name="message" required rows="4" placeholder="tell me about your quest..."></textarea></label>
              <div class="term__actions">
                <p class="term__status" id="formStatus" aria-live="polite"></p>
                <button class="btn" type="submit"><span class="btn__face">Send message<span class="px-ico" data-px="arrow"></span></span></button>
              </div>
            </div>
          </form>

          <div>
            <p class="contact__lead reveal" style="--d:.08s">Looking for a UX/UI&nbsp;designer?</p>
            <div class="email-row reveal" style="--d:.14s">
              <a data-email href="mailto:shiranrevivo193@gmail.com">shiranrevivo193@gmail.com</a>
              <button class="copy-btn" id="copyEmail" type="button"><span class="px-ico" data-px="copy"></span><span class="copy-btn__txt">Copy</span></button>
            </div>
            <ul class="socials reveal" style="--d:.2s">
              <li><a href="https://www.linkedin.com/in/shiran-revivo-093736347/" target="_blank" rel="noopener">LinkedIn <span class="px-ico" data-px="ext"></span></a></li>

              <li><a href="https://www.behance.net/shiranrevivo" target="_blank" rel="noopener">Behance <span class="px-ico" data-px="ext"></span></a></li>
            </ul>
          </div>
