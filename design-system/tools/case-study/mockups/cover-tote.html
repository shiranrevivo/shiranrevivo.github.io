<!doctype html><meta charset="utf-8"><title>Cover</title><style>
  html, body { margin: 0; background: var(--bg, transparent); }
  /* same language as the phone (phone.html): dark body #161615, thin translucent rim, dark glass edge */
  .stage { position: relative; width: 1000px; height: 540px; }
  .cover { width: 1000px; height: 625px; overflow: hidden; position: relative; }
  .cover .stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.84); }

  .laptop { position: absolute; left: 0; bottom: 0; width: 900px; }
  .lid { position: relative; width: 800px; margin: 0 auto; box-sizing: border-box; padding: 16px 16px 20px;
    border-radius: 26px 26px 6px 6px; background: #161615;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.22), inset 0 0 0 3px rgba(0,0,0,.6); }
  .lid::before { content: ""; position: absolute; left: 50%; top: 6px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #2c2c2b; }
  .screen { width: 768px; height: 480px; border-radius: 6px; overflow: hidden; background: #F0F0F0; }
  .screen img { display: block; width: 100%; height: auto; }
  .base { position: relative; height: 22px; border-radius: 2px 2px 16px 16px;
    background: linear-gradient(#3a3a39, #222221 45%, #121211);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.1); }
  .base::before { content: ""; position: absolute; left: 50%; top: 0; width: 140px; height: 8px; margin-left: -70px;
    border-radius: 0 0 10px 10px; background: #151514; box-shadow: inset 0 -1px 0 rgba(255,255,255,.12); }

  .phone { position: absolute; right: 0; bottom: 0; width: 232px; }
  .phone img { display: block; width: 100%; height: auto; }

  html,body{margin:0}
  .scene{position:relative;width:1000px;height:625px;overflow:hidden;background:url(tote.jpg) center/cover}
  .dev{position:absolute;transform-origin:left bottom}
  .dev .laptop{position:relative}
  .shadow{position:absolute;border-radius:50%;background:rgba(0,0,0,.38);filter:blur(10px)}
</style>
<div class="scene">
  <span class="shadow" style="left:var(--lx);top:calc(var(--ly) - 7px);width:var(--lw);height:14px"></span>
  <div class="dev" id="lap" style="left:var(--lx);top:calc(var(--ly) - 538px);transform:scale(var(--ls))"><div class="laptop"><div class="lid"><div class="screen"><img src="d-home.png" alt=""></div></div><div class="base"></div></div></div>
  <span class="shadow" style="left:calc(var(--px) + 6px);top:calc(var(--py) - 6px);width:calc(var(--pw) - 12px);height:12px"></span>
  <div class="dev" style="left:var(--px);top:calc(var(--py) - 489px);transform:scale(var(--ps))"><div class="phone" style="position:relative;right:auto;bottom:auto"><img src="m-about.png" alt=""></div></div>
</div>
<script>
const q=new URLSearchParams(location.search), st=document.querySelector('.scene').style;
const ls=+(q.get('ls')||.44), ps=+(q.get('ps')||.5);
st.setProperty('--ls',ls); st.setProperty('--ps',ps);
st.setProperty('--lx',(q.get('lx')||30)+'px'); st.setProperty('--ly',(q.get('ly')||598)+'px'); st.setProperty('--lw',(900*ls)+'px');
st.setProperty('--px',(q.get('px')||720)+'px'); st.setProperty('--py',(q.get('py')||598)+'px'); st.setProperty('--pw',(232*ps)+'px');
</script>
