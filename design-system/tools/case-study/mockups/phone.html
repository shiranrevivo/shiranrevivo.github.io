<!doctype html>
<meta charset="utf-8">
<title>Phone</title>
<style>
  html, body { margin: 0; background: transparent; }
  /* 410×864 css px @2x → 820×1728 png. Thin dark body + translucent rim, same anatomy as The Hill of Memory phones */
  .phone {
    position: relative; width: 410px; height: 864px; box-sizing: border-box;
    padding: 10px; border-radius: 60px;
    background: #161615;
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.22), inset 0 0 0 3px rgba(0,0,0,.6);
  }
  .screen { position: relative; width: 390px; height: 844px; border-radius: 50px; overflow: hidden; background: var(--bg); }
  .status { position: absolute; inset: 0 0 auto; height: 47px; background: var(--bg); z-index: 2;
    font: 600 17px/1 -apple-system, "SF Pro Text", system-ui, sans-serif; color: #000; }
  .time { position: absolute; left: 50px; top: 17px; letter-spacing: -.2px; }
  .island { position: absolute; left: 50%; top: 11px; width: 125px; height: 37px; margin-left: -62.5px; border-radius: 20px; background: #000; }
  .icons { position: absolute; right: 30px; top: 18px; display: flex; gap: 6px; align-items: center; }
  .content { position: absolute; left: 0; top: 47px; width: 390px; height: 797px; overflow: hidden; }
  .content img { display: block; width: 390px; height: auto; }
  .piece { position: relative; overflow: hidden; }
  .piece img { position: absolute; left: 0; }
  .home-bar { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #000; z-index: 3; }
</style>
<div class="phone">
  <div class="screen" id="screen">
    <div class="status">
      <span class="time">9:41</span>
      <span class="island"></span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.6c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .8 10.3 10.3 0 0 0 .8 3.7L2 5c1.6-1.5 3.7-2.4 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4.4 6.6 6.6 0 0 0 3.4 6.2l1.2 1.3C5.5 6.7 6.7 6.2 8 6.2Zm0 3.5c.5 0 1 .2 1.3.5L8 11.6l-1.3-1.4c.3-.3.8-.5 1.3-.5Z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill-opacity=".4"/></svg>
      </span>
    </div>
    <div class="content" id="content"></div>
    <span class="home-bar"></span>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const src = q.get('src'), bg = q.get('bg') || '#F0F0F0';
  document.getElementById('screen').style.setProperty('--bg', bg);
  const c = document.getElementById('content');
  if (q.get('split')) {
    // keep the top `split` px and the bottom of the image, dropping empty middle space
    const top = +q.get('split'), imgH = +q.get('h'), rest = 797 - top - (+q.get('pad') || 0);
    c.innerHTML = `<div class="piece" style="height:${top}px"><img src="${src}" style="top:0"></div>` +
                  `<div class="piece" style="height:${rest}px"><img src="${src}" style="top:${rest - imgH}px"></div>`;
  } else {
    c.innerHTML = `<img src="${src}">`;
  }
</script>
