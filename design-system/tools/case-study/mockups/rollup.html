<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.scene{width:900px;height:1400px;display:grid;place-items:center;perspective:2600px}
.stand{position:relative;width:440px;transform:rotateY(-24deg) rotateX(2deg);transform-style:preserve-3d}
/* top rail: a thin aluminium bar the banner hangs from */
.rail{position:relative;z-index:2;height:16px;margin:0 -6px;border-radius:8px;
  background:linear-gradient(#f4f4f4,#c9c9c9 40%,#8d8d8d 80%,#6a6a6a);box-shadow:inset 0 1px 0 #fff}
.rail::before,.rail::after{content:"";position:absolute;top:2px;width:10px;height:12px;border-radius:3px;background:linear-gradient(#bdbdbd,#555)}
.rail::before{left:-4px}.rail::after{right:-4px}
.banner{position:relative;display:block;width:440px;height:1035px;margin-top:-6px;
  background:url(banner.jpg) center/100% 100%}
/* light falling across the print: a soft sheen and a slightly darker far edge */
.banner::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 35%,rgba(0,0,0,0) 70%,rgba(0,0,0,.22) 100%),
             linear-gradient(rgba(255,255,255,.05),rgba(0,0,0,0) 30%)}
/* the cassette the banner rolls into */
.base{position:relative;height:74px;margin:-14px -34px 0;border-radius:26px 26px 14px 14px;
  background:linear-gradient(#ffffff 0%,#e9e9e9 18%,#c4c4c4 52%,#9a9a9a 78%,#7b7b7b 100%);
  box-shadow:inset 0 2px 0 #fff,inset 0 -3px 6px rgba(0,0,0,.25)}
.base::before{content:"";position:absolute;left:28px;right:28px;top:10px;height:8px;border-radius:4px;background:linear-gradient(#6f6f6f,#2c2c2c)}   /* the slot */
.cap{position:absolute;top:-6px;width:46px;height:86px;border-radius:24px 24px 18px 18px;
  background:linear-gradient(90deg,#5a5a5a,#d8d8d8 35%,#ffffff 50%,#a9a9a9 75%,#4d4d4d)}
.cap--l{left:-20px}.cap--r{right:-20px}
.feet{position:relative;height:12px;margin:0 -10px}
.feet i{position:absolute;bottom:0;width:120px;height:12px;border-radius:0 0 6px 6px;background:linear-gradient(#8a8a8a,#3e3e3e)}
.feet i:first-child{left:10px}.feet i:last-child{right:10px}
</style></head><body><div class="scene"><div class="stand">
<div class="rail"></div><div class="banner"></div>
<div class="base"><span class="cap cap--l"></span><span class="cap cap--r"></span></div>
<div class="feet"><i></i><i></i></div>
</div></div></body></html>
